<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Focus Circuit</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>Focus Circuit</h1>

    <!-- CONTROLS -->
    <div class="panel">

      <label>Focus Time (minutes)</label>
      <input id="timeInput" type="number" value="25" min="1">

      <label>Lap Interval (minutes per lap)</label>
      <input id="lapInput" type="number" value="5" min="1">

      <button onclick="startSession()">Start Session</button>
      <button onclick="resetSession()">Reset</button>

    </div>

    <!-- STATUS -->
    <div class="status">

      <h2 id="timer">00:00</h2>
      <p>Laps Completed: <span id="laps">0</span></p>

      <div class="bar">
        <div id="progress"></div>
      </div>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
